# Pipeline do GitLab Wizard. Os jobs de integração/E2E precisam de Docker (Testcontainers) → docker:dind.
# ATENÇÃO: este arquivo ainda não foi executado em um runner real; revise as imagens e as variáveis do seu ambiente.

stages: [verify, test, build]

default:
  image: node:26
  interruptible: true

variables:
  NPM_CONFIG_CACHE: $CI_PROJECT_DIR/.npm
  # Postgres de teste via Testcontainers falando com o dind
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ''
  TESTCONTAINERS_HOST_OVERRIDE: docker
  TESTCONTAINERS_RYUK_DISABLED: 'true'

.npm-cache: &npm-cache
  cache:
    key: { files: [package-lock.json] }
    paths: [.npm/]

.install: &install
  - npm ci --prefer-offline
  - npx prisma generate
  # `prisma generate` não conecta ao banco; o config só precisa de uma URL qualquer.
  # (DATABASE_URL abaixo é descartável)

lint-typecheck-unit:
  stage: verify
  <<: *npm-cache
  variables: { DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci' }
  script:
    - *install
    - npm run format:check
    - npm run lint
    - npm run typecheck
    - npm test

audit:
  stage: verify
  <<: *npm-cache
  script:
    - npm ci --prefer-offline --ignore-scripts
    # produção: nenhuma vulnerabilidade moderada ou pior; ferramentas de dev: bloqueia só alta/crítica
    - npm audit --omit=dev --audit-level=moderate
    - npm audit --audit-level=high
  allow_failure: false

# Garante que a imagem Docker builda: SEM variáveis de runtime (como no Dockerfile).
build-without-env:
  stage: verify
  <<: *npm-cache
  variables: { DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci' }
  script:
    - *install
    - env -i PATH="$PATH" HOME="$HOME" npm run build

integration:
  stage: test
  <<: *npm-cache
  services: [{ name: 'docker:27-dind', alias: docker, command: ['--tls=false'] }]
  variables: { DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci' }
  script:
    - *install
    - npm run test:integration

e2e:
  stage: test
  <<: *npm-cache
  services: [{ name: 'docker:27-dind', alias: docker, command: ['--tls=false'] }]
  variables: { DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci' }
  script:
    - *install
    - npx playwright install --with-deps chromium
    - npm run test:e2e
  artifacts:
    when: on_failure
    paths: [test-results/]
    expire_in: 1 week

# Imagens de produção. Publica no registry do projeto em main e em tags.
.docker: &docker
  image: docker:27
  services: [{ name: 'docker:27-dind', alias: docker, command: ['--tls=false'] }]
  before_script: [docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"]

images:
  stage: build
  <<: *docker
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - export TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - docker build --target runner  -t "$CI_REGISTRY_IMAGE:$TAG"         .
    - docker build --target migrate -t "$CI_REGISTRY_IMAGE/migrate:$TAG" .
    - docker push "$CI_REGISTRY_IMAGE:$TAG"
    - docker push "$CI_REGISTRY_IMAGE/migrate:$TAG"
